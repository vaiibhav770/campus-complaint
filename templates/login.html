{% extends "base.html" %}
{% block title %}Sign In &bull; SmartCampus{% endblock %}

{% block extra_css %}
<style>
  .auth-container {
    max-width: 480px;
    margin: 30px auto 50px;
  }
  .auth-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: var(--shadow-md);
  }
  .auth-header {
    margin-bottom: 26px;
    text-align: center;
  }
  .auth-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  }
  .auth-title {
    font-size: 1.45rem;
    font-weight: 800;
    color: var(--text-main);
  }
  .auth-sub {
    font-size: 0.86rem;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    margin-bottom: 22px;
    font-size: 0.86rem;
  }
  .remember-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: var(--secondary);
    font-weight: 500;
    margin-bottom: 0;
  }
  .remember-label input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--primary);
    cursor: pointer;
  }
  .register-prompt {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.88rem;
    color: var(--text-muted);
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h1 class="auth-title">Sign In to Campus Portal</h1>
      <p class="auth-sub">Enter your registered credentials to access your dashboard</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label>Username / Roll No / ID <span class="req">*</span></label>
        <input type="text" name="username" id="usernameInput" placeholder="Enter your registered username" value="{{ prefill_username or '' }}" required autofocus>
      </div>

      <div class="form-group">
        <label>Password <span class="req">*</span></label>
        <input type="password" name="password" id="passwordInput" placeholder="Enter your password" required>
      </div>

      <div class="form-options">
        <label class="remember-label">
          <input type="checkbox" name="remember_me" value="1" checked>
          <span>Remember my login</span>
        </label>
        <a href="{{ url_for('register') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">
          Create new account
        </a>
      </div>

      <div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
      </div>
    </form>

    <div class="register-prompt">
      Don't have an account yet?
      <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-left: 4px;">
        Register here <i class="fa-solid fa-arrow-right" style="font-size:0.75rem;"></i>
      </a>
    </div>
  </div>
</div>
{% endblock %}
